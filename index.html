<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>可编程线段树可视化</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .editor-area {
      font-family: monospace;
    }
    canvas {
      border: 1px solid #ccc;
    }
  </style>
</head>
<body class="bg-gray-100 p-4">
  <h1 class="text-xl font-bold mb-3">线段树可视化 | 自定义 pushup / pushdown</h1>
  <div class="flex gap-4 h-[85vh]">
    <!-- 左窗口：编辑器与控制面板 -->
    <div class="w-1/3 flex flex-col gap-2">
      <div class="bg-white p-3 rounded shadow">
        <div class="flex gap-2 mb-2">
          <label>数组大小 n:</label>
          <input id="inputN" type="number" value="8" min="1" class="border px-2 w-20">
          <button id="btnRebuild" class="bg-blue-500 text-white px-3 rounded">重建树</button>
        </div>
        <div class="mb-2">
          <label>初始化数组(逗号分隔):</label>
          <input id="initArr" value="1,2,3,4,5,6,7,8" class="border w-full px-2">
        </div>
      </div>

      <div class="bg-white p-3 rounded shadow flex-1 overflow-auto">
        <h3 class="font-semibold">pushup(合并子节点到父节点)</h3>
        <textarea id="codePushup" class="w-full h-32 editor-area border p-1">
// node 父节点，l左孩子，r右孩子
// node.val 是节点维护信息
// 示例：求和线段树
node.val = l.val + r.val;
        </textarea>

        <h3 class="font-semibold mt-2">pushdown(懒标记下传)</h3>
        <textarea id="codePushdown" class="w-full h-32 editor-area border p-1">
// node父节点，l左孩子，r右孩子
// node.lazy 懒标记
// 区间加懒标记示例
if(node.lazy !== 0) {
  l.val += node.lazy;
  l.lazy += node.lazy;
  r.val += node.lazy;
  r.lazy += node.lazy;
  node.lazy = 0;
}
        </textarea>
      </div>

      <div class="bg-white p-3 rounded shadow">
        <div class="flex gap-2 flex-wrap">
          <input id="opL" placeholder="l" type="number" class="w-14 border px-1">
          <input id="opR" placeholder="r" type="number" class="w-14 border px-1">
          <input id="opVal" placeholder="val" type="number" class="w-14 border px-1">
          <button id="btnRangeAdd" class="bg-green-500 text-white px-2 rounded">区间加</button>
          <button id="btnQuery" class="bg-orange-500 text-white px-2 rounded">区间查询</button>
        </div>
        <div class="mt-2">输出：<span id="output"></span></div>
      </div>
    </div>

    <!-- 右窗口：Canvas绘图窗口 -->
    <div class="w-2/3 bg-white p-3 rounded shadow">
      <canvas id="treeCanvas" width="900" height="700"></canvas>
    </div>
  </div>

  <script src="js/sandbox.js"></script>
  <script src="js/segmentTree.js"></script>
  <script src="js/renderer.js"></script>
</body>
</html>
